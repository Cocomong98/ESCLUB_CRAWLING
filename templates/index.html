<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FC 온라인 감독모드 전적 크롤러</title>
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body>
        <div class="container">
            <h1>FC 온라인 감독모드 전적 분석기</h1>
            <p>버튼을 클릭하여 `urls.txt`에 등록된 구단주들의 감독모드 전적 크롤링을 시작하세요. 최신 데이터를 가져와 순위를 업데이트합니다.</p>
            <p>데이터 수집에는 몇 분 정도 소요될 수 있습니다. 잠시만 기다려주세요!</p>
            <button id="startCrawlBtn">크롤링 시작</button>
            <div class="loader" id="loader"></div>

            <p id="statusMessage"></p>
            <div id="resultsOutput"></div>
        </div>
        <script src="/static/script.js"></script>
    </body>
</html>
